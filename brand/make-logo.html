<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PumpKart logo</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet" />
<style>body { margin: 0; background: #0a0014; } canvas { display: block; }</style>
</head>
<body>
<canvas id="logo" width="720" height="360" aria-label="PumpKart logo"></canvas>
<script type="module">
// Transparent sign-in logo. The P mark forms the first letter of the wordmark.
const P = new Path2D('M108 100 H252 C309 100 334 129 334 170 C334 212 303 240 252 240 H182 V320 H108 Z M182 156 V184 H246 C261 184 270 179 270 170 C270 161 261 156 246 156 Z');
await document.fonts.load('900 84px Orbitron');
const c = document.getElementById('logo').getContext('2d');
const font = 84, cap = font * 0.72, scale = cap / 220;
c.font = `900 ${font}px Orbitron`;
const ump = c.measureText('UMP').width, kart = c.measureText('KART').width;
const markWidth = 226 * scale, total = markWidth + 9 + ump + kart;
const x = (720 - total) / 2, baseline = 180 + cap / 2;
c.save();
c.translate(x, baseline - cap);
c.scale(scale, scale);
c.translate(-108, -100);
c.transform(1, 0, -0.2493, 1, 51.1, 0);
c.fillStyle = '#ff006e';
c.fill(P, 'evenodd');
c.clip(P, 'evenodd');
c.globalCompositeOperation = 'destination-out';
c.fillRect(130, 100, 9, 230);
c.fillRect(147, 100, 4, 230);
c.restore();
c.fillStyle = '#ffffff';
c.fillText('UMP', x + markWidth + 9, baseline);
c.fillStyle = '#ff006e';
c.fillText('KART', x + markWidth + 9 + ump, baseline);
document.title = 'ready';
</script>
</body>
</html>
