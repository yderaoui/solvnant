# Game server: Cloudflare Worker + Durable Object (free plan, SQLite-backed DO class).
# Local:  npm run game        (ws://localhost:8787/ws)
# Deploy: npx wrangler deploy
name = "ai-grand-prix-game"
main = "src/game/worker.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
