# Game server: Cloudflare Worker + Durable Object (free plan, SQLite-backed DO class).
# Local:  npm run game        (ws://localhost:8787/ws)
# Deploy: npx wrangler deploy
name = "ai-grand-prix-game"
main = "src/game/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"] # @solana/kit (house wallet signing)

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Hub"]

# Public settings (secrets go in `wrangler secret put NAME`, or .dev.vars locally):
#   SESSION_SECRET, X_CLIENT_ID, X_CLIENT_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
[vars]
SITE_URL = "https://www.racetrench.com" # local dev overrides this in .dev.vars
# TOKEN_MINT = ""          # set to the game's SPL token mint to turn on the $MIN_HOLD_USD gate
MIN_HOLD_USD = "20"
X_MIN_ACCOUNT_DAYS = "30"
X_MIN_FOLLOWERS = "5"
POINTS_SIGNUP = "1000"
POINTS_DAILY = "100"
POINTS_ENTRY_FEE = "50"
POINTS_PRIORITY_FEE = "200"
MAX_PRIORITY_PER_RACE = "3"
BET_RAKE_PCT = "5"

# Race tickets paid in the game coin: $RACE (Race Trench, pump.fun; Token-2022, no transfer fee, no mint
# or freeze authority). Tickets cost TICKET_PRICE_USD, paid in $RACE at the live price (Jupiter /
# DexScreener, the lower one); racers cost 5 tickets. TICKET_PRICE = 0: no fixed fallback, so if the price
# can't be read, purchases are refused rather than sold at a stale amount. Payment codes, tickets and
# lobbies are tied to the coin, so nothing from the $PTEST test (2EtATUYc...vk4C8) carries over.
# Secret: TICKET_VERIFY_KEY (wrangler secret put) = the site's RPC_PROXY_KEY.
# Browsers and Privy use TICKET_RPC_URL (the site's proxy, which forwards to Helius: SOLANA_UPSTREAM_MAINNET on Vercel).
TICKET_CLUSTER = "mainnet-beta"
TICKET_MINT = "BJLoxTq2dkU46hXzL2UNjDPEHWs5ugKirFERYffpump"
TICKET_DECIMALS = "6"
TICKET_TREASURY = "WXzD5Ph7zbaAebNXGxtG2QjbENeUuypNqnqkNsNFVHc"
TICKET_PRICE = "0"
TICKET_PRICE_USD = "20"
TICKET_SYMBOL = "$RACE"
TICKET_RPC_URL = "https://solvnant.vercel.app/api/solana-rpc?cluster=mainnet-beta"
TICKET_VERIFY_URL = "https://solvnant.vercel.app/api/solana-rpc"

# Privy: sign-in (X, email, Google, wallet) + an embedded Solana wallet for every player.
# Public app id (dashboard.privy.io). Remove to go back to the built-in X / guest sign-in.
PRIVY_APP_ID = "cmuxzi8fk01ja0bjtygjpghge"
