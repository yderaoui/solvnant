[package]
name = "tracklab_pots"
version = "0.1.0"
description = "TrackLab prize pots (devnet only, unaudited)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tracklab_pots"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
