name: Schedule races

# Every 30 minutes the scheduler fills the next 12 hours of 5-minute slots. GitHub cron is
# best-effort (in practice it fires every 5-7 hours), so the long lookahead keeps the league full. Free and unlimited on public repos.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: schedule-races
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          SITE_URL: ${{ vars.SITE_URL }}
          RACES_AHEAD_MINUTES: ${{ vars.RACES_AHEAD_MINUTES || '720' }}
